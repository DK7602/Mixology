<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Mixology Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="link.css">
<script src="link_mock.js"></script>
<script type="module" src="link.js"></script>
</head>
<body>
<div id="viewport">
<div id="lstage">
  <div id="lframe"></div>
  <button id="logoBtn" type="button" title="Switch light / dark look" aria-label="Switch light / dark look">
    <img src="logo.png" alt="Mixology">
  </button>
  <img id="lwordmark" src="wordmark.png" alt="MIXOLOGY">
  <div id="lsubtitle"><span class="a">TRACK</span> <span class="b">LINK</span></div>
  <div id="lstatus"></div>

  <div id="ltrack" class="card">
    <div id="lcolour"></div>
    <div id="lname"></div>
    <div id="lsub"></div>
  </div>

  <div id="lmeters" class="card"></div>
  <div id="ltrim" class="card"></div>
  <div id="lassist" class="card"></div>
</div>
</div>
</body>
</html>
