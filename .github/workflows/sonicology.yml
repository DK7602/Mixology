name: Sonicology suite

# The whole suite in one installer per platform: Voxology (+ Honey Tune), Mixology (+ Mixology Link) and
# Masterology, each built from its own repository (all three are public), for Windows and macOS (universal:
# Apple Silicon and Intel). Run it from Actions -> Sonicology suite -> Run workflow. The installers are the run's
# artifacts: Sonicology-Windows (Sonicology-Setup-Windows.exe) and Sonicology-macOS (Sonicology-Installer-macOS.pkg).
# Each repository's own CI runs the tests and validators; this only builds and packs.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Name of this release (shown in the installers)"
        default: "Beta 1"
      version:
        description: "Suite version (installer version number)"
        default: "0.1.0"
      voxology_ref:
        description: "Voxology branch"
        default: "claude/upbeat-faraday-iyzicv"
      masterology_ref:
        description: "Masterology branch"
        default: "claude/eloquent-einstein-sscadx"
      reuse_run:
        description: "Only repack: the run ID whose built plug-ins to use (empty: build them)"
        default: ""

permissions:
  contents: read
  actions: read   # reuse_run: read another run's artifacts

jobs:
  # The three plug-ins only see each other when their shared files are the same: stop before building a suite
  # that can't talk (a branch that missed a sync).
  shared:
    name: Shared files match
    if: inputs.reuse_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mixology
      - uses: actions/checkout@v4
        with:
          repository: DK7602/Voxology
          ref: ${{ inputs.voxology_ref }}
          path: voxology
      - uses: actions/checkout@v4
        with:
          repository: DK7602/polisher
          ref: ${{ inputs.masterology_ref }}
          path: masterology
      - name: Compare
        run: |
          bad=0
          for f in dsp/include/suite/SuiteLink.h dsp/src/SuiteLink.cpp plugin/ui/daws.js plugin/ui/mixstyles.js; do
            if [ "$(md5sum mixology/$f voxology/$f masterology/$f | cut -d' ' -f1 | sort -u | wc -l)" = 1 ]; then
              echo "same in all three: $f"
            else
              echo "::error::$f is not the same in Mixology, Voxology and Masterology"
              md5sum mixology/$f voxology/$f masterology/$f
              bad=1
            fi
          done
          exit $bad

  build:
    name: ${{ matrix.plugin }} (${{ matrix.name }})
    needs: shared
    if: inputs.reuse_run == ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin: Voxology, repo: DK7602/Voxology, ref: voxology, name: Windows, os: windows-latest, options: "-DVOX_BUILD_TESTS=OFF" }
          - { plugin: Voxology, repo: DK7602/Voxology, ref: voxology, name: macOS, os: macos-14, options: "-DVOX_BUILD_TESTS=OFF" }
          - { plugin: Mixology, repo: DK7602/Mixology, ref: mixology, name: Windows, os: windows-latest, options: "-DMIX_BUILD_TESTS=OFF" }
          - { plugin: Mixology, repo: DK7602/Mixology, ref: mixology, name: macOS, os: macos-14, options: "-DMIX_BUILD_TESTS=OFF" }
          - { plugin: Masterology, repo: DK7602/polisher, ref: masterology, name: Windows, os: windows-latest, options: "-DPOLISHER_BUILD_TESTS=OFF" }
          - { plugin: Masterology, repo: DK7602/polisher, ref: masterology, name: macOS, os: macos-14, options: "-DPOLISHER_BUILD_TESTS=OFF" }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref == 'voxology' && inputs.voxology_ref || matrix.ref == 'masterology' && inputs.masterology_ref || github.sha }}
          path: src

      - name: Cache fetched dependencies (JUCE, ARA, Catch2)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: suite-deps-${{ matrix.plugin }}-${{ runner.os }}-${{ hashFiles('src/CMakeLists.txt') }}

      - name: Fetch WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.0.3485.44"
          $root = ("$env:RUNNER_TEMP/nuget") -replace '\\','/'
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath "$root/Microsoft.Web.WebView2.$v"
          "WEBVIEW2_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.options }} ${{ runner.os == 'Windows' && format('-DJUCE_WEBVIEW2_PACKAGE_LOCATION={0}', env.WEBVIEW2_DIR) || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Stage
        shell: bash
        run: |
          P="part/${{ matrix.plugin }}"
          mkdir -p "$P/VST3" "$P/AU"
          case "${{ matrix.plugin }}" in
            Voxology)    bundles=("plugin/Voxology_artefacts" "honeytune/HoneyTune_artefacts"); manual="docs/MANUAL.md" ;;
            Mixology)    bundles=("plugin/Mixology_artefacts" "link/MixologyLink_artefacts"); manual="docs/MANUAL.md" ;;
            Masterology) bundles=("plugin/Polisher_artefacts"); manual="docs/manual/polisher-manual.md" ;;
          esac
          for b in "${bundles[@]}"; do
            cp -R build/$b/Release/VST3/*.vst3 "$P/VST3/"
            if ls build/$b/Release/AU/*.component >/dev/null 2>&1; then cp -R build/$b/Release/AU/*.component "$P/AU/"; fi
          done
          cp "src/$manual" "$P/Manual.md"
          grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' src/CMakeLists.txt | head -1 | cut -d' ' -f2 > "$P/version.txt"
          if [ "${{ matrix.plugin }}" = "Mixology" ]; then
            mkdir -p "$P/Cubase MIDI Remote" "$P/FL Studio" "$P/Ableton"
            cp -R src/bridge/cubase/Mixology "$P/Cubase MIDI Remote/"
            cp -R "src/bridge/flstudio/Mixology Bridge" "$P/FL Studio/"
            cp -R src/bridge/ableton/MixologyBridge "$P/Ableton/"
          fi
          find part -maxdepth 3 | sort
          echo "${{ matrix.plugin }} $(cat "$P/version.txt")"

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.plugin }}-${{ matrix.name }}
          path: part
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: [shared, build]
    if: ${{ !cancelled() && (needs.shared.result == 'success' || needs.shared.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*-Windows
          path: stage
          merge-multiple: true
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Read Me and manuals
        shell: bash
        run: |
          v() { cat "stage/$1/version.txt" | tr -d '\r\n'; }
          sed -e "s|@LABEL@|${{ inputs.label }}|" -e "s|@VOXOLOGY@|$(v Voxology)|" -e "s|@MIXOLOGY@|$(v Mixology)|" \
              -e "s|@MASTEROLOGY@|$(v Masterology)|" "installer/Read Me First.txt" > "stage/Read Me First.txt"
          mkdir -p stage/Manuals
          for p in Voxology Mixology Masterology; do cp "stage/$p/Manual.md" "stage/Manuals/$p Manual.txt"; done
          cat "stage/Read Me First.txt" | head -8
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DStage=$PWD\stage" "/DSuiteVersion=${{ inputs.version }}" "/DLabel=${{ inputs.label }}" installer\windows\Sonicology.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "stage\Read Me First.txt" out\
      - uses: actions/upload-artifact@v4
        with:
          name: Sonicology-Windows
          path: out
          if-no-files-found: error

  macos:
    name: macOS installer
    needs: [shared, build]
    if: ${{ !cancelled() && (needs.shared.result == 'success' || needs.shared.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*-macOS
          path: stage
          merge-multiple: true
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Read Me and manuals
        run: |
          v() { tr -d '\r\n' < "stage/$1/version.txt"; }
          sed -e "s|@LABEL@|${{ inputs.label }}|" -e "s|@VOXOLOGY@|$(v Voxology)|" -e "s|@MIXOLOGY@|$(v Mixology)|" \
              -e "s|@MASTEROLOGY@|$(v Masterology)|" "installer/Read Me First.txt" > "stage/Read Me First.txt"
          mkdir -p stage/Manuals
          for p in Voxology Mixology Masterology; do cp "stage/$p/Manual.md" "stage/Manuals/$p Manual.txt"; done
      # Apple's Audio Unit check on every AU the package holds (Logic only loads AUs that pass it). Reported here;
      # a failure doesn't stop the installer (the VST3s are fine either way), so read this step when it's red.
      - name: Audio Unit validation (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for c in stage/*/AU/*.component; do
            cp -R "$c" ~/Library/Audio/Plug-Ins/Components/
            name=$(basename "$c")
            find ~/Library/Audio/Plug-Ins/Components/"$name" -path "*/Contents/MacOS/*" -type f -exec chmod 755 {} +
            codesign --force --deep --sign - ~/Library/Audio/Plug-Ins/Components/"$name"
          done
          killall -9 AudioComponentRegistrar || true
          failed=0
          for id in "aumf Vox1 Voxa" "aufx Hny1 Voxa" "aufx Mxl1 Mxlg" "aufx Mxk1 Mxlg" "aufx Pls1 Plsh"; do
            # (passes only with Apple's own success line: an exit code of 0 alone isn't trusted)
            if auval -v $id > auval.log 2>&1 && grep -q "AU VALIDATION SUCCEEDED" auval.log; then
              echo "auval $id: PASS ($(grep -c "PASS" auval.log) checks passed)"
            else
              echo "auval $id: FAIL"; tail -30 auval.log; failed=1
            fi
          done
          exit $failed

      - name: Build the package
        run: |
          chmod +x installer/mac/build-pkg.sh
          installer/mac/build-pkg.sh "$PWD/stage" "${{ inputs.version }}" "${{ inputs.label }}" "$PWD/out"
          cp "stage/Read Me First.txt" out/
          pkgutil --expand-full out/Sonicology-Installer-macOS.pkg "$RUNNER_TEMP/expanded"
          find "$RUNNER_TEMP/expanded" -maxdepth 8 \( -name "*.vst3" -o -name "*.component" \) -prune | sed "s|$RUNNER_TEMP/expanded/||" | sort
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Sonicology-macOS
          path: out
          if-no-files-found: error
